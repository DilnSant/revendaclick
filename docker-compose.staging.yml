# =============================================================================
# RevendaClick — Staging Stack (VPS)
# Frontend runs on Vercel — NOT dockerized here.
# Usage: docker compose -f docker-compose.staging.yml --env-file .env up -d
# =============================================================================

services:

  # ── PostgreSQL local para Evolution API (staging isolado) ────────────────────
  postgres-evolution:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${POSTGRES_EVOLUTION_PASSWORD:-evolution_secret}
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - revendaclick

  # ── Evolution API (WhatsApp) ─────────────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    environment:
      - SERVER_URL=https://evolution.revendaclick.com.br
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${POSTGRES_EVOLUTION_PASSWORD:-evolution_secret}@postgres-evolution:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_staging
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://backend:8080/api/webhooks/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - QRCODE_LIMIT=30
      - LOG_LEVEL=WARN
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      postgres-evolution:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - revendaclick
      - coolify-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.rc-evolution-stg.rule=Host(`evolution.revendaclick.com.br`)
      - traefik.http.routers.rc-evolution-stg.entrypoints=https
      - traefik.http.routers.rc-evolution-stg.tls=true
      - traefik.http.routers.rc-evolution-stg.tls.certresolver=letsencrypt
      - traefik.http.routers.rc-evolution-stg.service=rc-evolution-stg-svc
      - traefik.http.services.rc-evolution-stg-svc.loadbalancer.server.port=8080
      - traefik.http.routers.rc-evolution-stg-http.rule=Host(`evolution.revendaclick.com.br`)
      - traefik.http.routers.rc-evolution-stg-http.entrypoints=http
      - traefik.http.routers.rc-evolution-stg-http.middlewares=rc-https-redirect@docker

  # ── Go backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      - ENV=production
      - ALLOWED_ORIGINS=https://app.revendaclick.com.br,https://revendaclick.com.br,https://www.revendaclick.com.br
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_ENV=${ASAAS_ENV:-production}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - METRICS_TOKEN=${METRICS_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - revendaclick
      - coolify-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.rc-api-stg.rule=Host(`api.revendaclick.com.br`)
      - traefik.http.routers.rc-api-stg.entrypoints=https
      - traefik.http.routers.rc-api-stg.tls=true
      - traefik.http.routers.rc-api-stg.tls.certresolver=letsencrypt
      - traefik.http.routers.rc-api-stg.service=rc-api-stg-svc
      - traefik.http.services.rc-api-stg-svc.loadbalancer.server.port=8080
      - traefik.http.routers.rc-api-stg-http.rule=Host(`api.revendaclick.com.br`)
      - traefik.http.routers.rc-api-stg-http.entrypoints=http
      - traefik.http.routers.rc-api-stg-http.middlewares=rc-https-redirect@docker
      - traefik.http.middlewares.rc-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.rc-https-redirect.redirectscheme.permanent=true

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_evolution_data:
  backend_logs:
  evolution_instances:
  evolution_store:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  revendaclick:
    driver: bridge
  coolify-proxy:
    external: true
    name: coolify
