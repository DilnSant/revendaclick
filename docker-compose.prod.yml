services:

  # ── Go backend API ───────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    ports:
      # Bind to localhost only — Nginx on the host proxies HTTPS → here
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ALLOWED_ORIGINS=https://app.revendaclick.com.br,https://revendaclick.com.br,https://www.revendaclick.com.br
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_ENV=${ASAAS_ENV:-production}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - revendaclick
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  # ── Evolution API (WhatsApp) ─────────────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    ports:
      # Bind to localhost only — Nginx on the host proxies HTTPS → here
      - "127.0.0.1:8081:8080"
    environment:
      - SERVER_URL=https://evolution.revendaclick.com.br
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      # CRITICAL: Evolution Prisma requires session pooler port 5432 (not transaction pooler 6543)
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URL}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://backend:8080/api/webhooks/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - QRCODE_LIMIT=30
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - revendaclick
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # ── Daily backup (03:00 UTC) ──────────────────────────────────────────────────
  backup:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache postgresql-client aws-cli bash curl > /dev/null 2>&1
        while true; do
          NOW=$(date +%s)
          NEXT=$(date -d 'tomorrow 03:00' +%s 2>/dev/null || \
                 python3 -c "import datetime,time; t=datetime.datetime.now().replace(hour=3,minute=0,second=0); t+=datetime.timedelta(days=1); print(int(t.timestamp()))" 2>/dev/null || \
                 echo $((NOW + 86400)))
          sleep $((NEXT - NOW))
          /scripts/backup.sh
        done
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-sa-east-1}
    volumes:
      - /opt/revendaclick/backups:/opt/revendaclick/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/revendaclick/backup.sh:/scripts/backup.sh:ro
    restart: unless-stopped
    networks:
      - revendaclick
    deploy:
      resources:
        limits:
          memory: 128m

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  backend_logs:
  evolution_instances:
  evolution_store:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  revendaclick:
    driver: bridge
