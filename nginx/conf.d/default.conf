##
## RevendaClick — nginx reverse proxy
##
## Sits behind Traefik (SSL terminated by Traefik).
## X-Forwarded-Proto: https is forwarded by Traefik.
##
## Routing:
##   /api/upload/*   → Next.js  (Supabase Storage upload handler)
##   /api/fipe/*     → Next.js  (FIPE external API proxy)
##   /api/billing/*  → Next.js  (billing server actions)
##   /api/evolution/ → Next.js  (Evolution proxy — adds Bearer token)
##   /api/health     → Next.js  (frontend health endpoint)
##   /api/*          → Go backend  (all other API calls)
##   /*              → Next.js  (frontend pages)
##

server {
    listen 80;
    server_name app.revendaclick.com.br _;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;

    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = '') {
        set $forwarded_proto $scheme;
    }

    # ── Coolify / load-balancer health probe ──────────────────────────────────
    location = /health {
        proxy_pass         http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        access_log         off;
    }

    # ── Next.js API routes (must come before the generic /api/ block) ─────────
    # nginx uses longest prefix match, so these take priority over /api/ below.

    # Supabase Storage photo upload (large body, long timeout)
    location /api/upload/ {
        client_max_body_size 32m;
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # FIPE external API proxy (24h cache inside Next.js)
    location /api/fipe/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Billing server actions (subscribe, cancel)
    location /api/billing/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";
    }

    # Evolution/WhatsApp proxy — Next.js adds Bearer token server-side
    location /api/evolution/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Next.js /api/health endpoint (frontend service check)
    location = /api/health {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        access_log         off;
    }

    # ── Go backend API (all remaining /api/* routes) ──────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        proxy_buffer_size          16k;
        proxy_buffers              4 32k;
        proxy_busy_buffers_size    64k;
    }

    # ── Next.js static assets (immutable cache) ───────────────────────────────
    location /_next/static/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        expires            1y;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    location /favicon.ico {
        proxy_pass  http://frontend;
        access_log  off;
        expires     30d;
    }

    # ── Next.js frontend (catch-all) ─────────────────────────────────────────
    location / {
        limit_req zone=public burst=40 nodelay;

        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
