##
## RevendaClick — nginx reverse proxy
##
## This nginx instance sits behind Traefik (SSL is terminated by Traefik).
## Traefik forwards plain HTTP with X-Forwarded-Proto: https.
##
## Handles:
##   app.revendaclick.com.br  → frontend (Next.js) + /api/* proxy
##   _                        → any direct-IP or fallback request
##

server {
    listen 80;
    server_name app.revendaclick.com.br _;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;

    # When behind Traefik, forward the real protocol so Next.js generates
    # correct absolute URLs in SSR and redirects.
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = '') {
        set $forwarded_proto $scheme;
    }

    # ── Health check (Coolify / load balancer probes) ─────────────────────────
    location = /health {
        proxy_pass         http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        access_log         off;
    }

    # ── Backend Go API ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        proxy_buffer_size          16k;
        proxy_buffers              4 32k;
        proxy_busy_buffers_size    64k;
    }

    # ── Next.js static assets (immutable cache) ───────────────────────────────
    location /_next/static/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        expires            1y;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    location /favicon.ico {
        proxy_pass  http://frontend;
        access_log  off;
        expires     30d;
    }

    # ── Next.js frontend (catch-all) ─────────────────────────────────────────
    location / {
        limit_req zone=public burst=40 nodelay;

        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        # WebSocket support for Next.js HMR (dev) and server-sent events
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
