name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/dilnsant/revendaclick-backend

jobs:

  # ── Backend tests ─────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Tidy modules
        run: cd backend && go mod tidy

      - name: Vet
        run: cd backend && go vet ./...

      - name: Test
        run: cd backend && go test ./... -count=1 -race -timeout 60s

  # ── Build and push backend image ──────────────────────────────────────────
  build-push:
    name: Build & Push Backend
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # ── Deploy via SSH ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/revendaclick
            git pull origin main
            cp nginx.conf /etc/nginx/nginx.conf
            nginx -t && nginx -s reload
            BACKEND_IMAGE=${{ env.BACKEND_IMAGE }} \
            IMAGE_TAG=${{ github.sha }} \
            docker compose -f docker-compose.production.yml --env-file .env pull backend
            BACKEND_IMAGE=${{ env.BACKEND_IMAGE }} \
            IMAGE_TAG=${{ github.sha }} \
            docker compose -f docker-compose.production.yml --env-file .env up -d --remove-orphans
            docker image prune -f --filter "until=24h"

      - name: Smoke test
        run: |
          sleep 15
          bash scripts/smoke-test.sh https://api.revendaclick.com.br
