# =============================================================================
# RevendaClick — Production Stack
# Deploy: /opt/revendaclick/docker-compose.production.yml
# Usage : docker compose -f docker-compose.production.yml --env-file .env up -d
# =============================================================================

services:

  # ── Go backend API ───────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dilnsant/revendaclick-backend}:${IMAGE_TAG:-latest}
    container_name: rc_backend
    ports:
      - "127.0.0.1:8080:8080"          # localhost only — Nginx terminates TLS
    environment:
      PORT:                   "8080"
      ENV:                    "production"
      DATABASE_URL:           "${DATABASE_URL}"
      SUPABASE_URL:           "${SUPABASE_URL}"
      SUPABASE_JWT_SECRET:    "${SUPABASE_JWT_SECRET}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      ALLOWED_ORIGINS:        "https://app.revendaclick.com.br,https://revendaclick.com.br,https://www.revendaclick.com.br"
      EVOLUTION_API_URL:      "http://evolution:8080"
      EVOLUTION_API_KEY:      "${EVOLUTION_API_KEY}"
      OPENROUTER_API_KEY:     "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL:       "${OPENROUTER_MODEL:-openai/gpt-4o-mini}"
      ASAAS_API_KEY:          "${ASAAS_API_KEY}"
      ASAAS_ENV:              "${ASAAS_ENV:-production}"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    restart: unless-stopped
    networks:
      - revendaclick
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  # ── Redis (Evolution cache) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rc_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - revendaclick
    deploy:
      resources:
        limits:
          memory: 160m

  # ── Evolution API (WhatsApp) ─────────────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: rc_evolution
    ports:
      - "127.0.0.1:8081:8080"          # localhost only — Nginx terminates TLS
    environment:
      SERVER_URL:                          "https://evolution.revendaclick.com.br"
      AUTHENTICATION_API_KEY:             "${EVOLUTION_API_KEY}"
      DATABASE_PROVIDER:                  "postgresql"
      # CRITICAL: session pooler port 5432 (NOT transaction pooler 6543)
      DATABASE_CONNECTION_URI:            "${EVOLUTION_DATABASE_URL}"
      DATABASE_CONNECTION_CLIENT_NAME:    "evolution_api"
      DATABASE_SAVE_DATA_INSTANCE:        "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE:     "true"
      DATABASE_SAVE_MESSAGE_UPDATE:       "true"
      DATABASE_SAVE_DATA_CONTACTS:        "true"
      DATABASE_SAVE_DATA_CHATS:           "true"
      DATABASE_SAVE_DATA_LABELS:          "true"
      DATABASE_SAVE_DATA_HISTORIC:        "true"
      WEBHOOK_GLOBAL_ENABLED:             "true"
      WEBHOOK_GLOBAL_URL:                 "http://backend:8080/api/webhooks/evolution"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS:   "false"
      CACHE_REDIS_ENABLED:                "true"
      CACHE_REDIS_URI:                    "redis://rc_redis:6379"
      CACHE_REDIS_PREFIX_KEY:             "evolution"
      CACHE_REDIS_SAVE_INSTANCES:         "true"
      QRCODE_LIMIT:                       "30"
      LOG_LEVEL:                          "ERROR"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s
    restart: unless-stopped
    networks:
      - revendaclick
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  backend_logs:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  revendaclick:
    name: revendaclick
    driver: bridge
