# =============================================================================
# RevendaClick — Production Stack
# Deploy: /opt/revendaclick/docker-compose.production.yml
# Usage : docker compose -f docker-compose.production.yml --env-file .env up -d
# =============================================================================

services:

  # ── Go backend API ───────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dilnsant/revendaclick-backend}:${IMAGE_TAG:-latest}
    container_name: rc_backend
    ports:
      - "127.0.0.1:8080:8080"          # localhost only — Nginx terminates TLS
    environment:
      PORT:                   "8080"
      ENV:                    "production"
      DATABASE_URL:           "${DATABASE_URL}"
      SUPABASE_URL:           "${SUPABASE_URL}"
      SUPABASE_JWT_SECRET:    "${SUPABASE_JWT_SECRET}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      ALLOWED_ORIGINS:        "https://app.revendaclick.com.br,https://revendaclick.com.br,https://www.revendaclick.com.br"
      EVOLUTION_API_URL:      "http://evolution:8080"
      EVOLUTION_API_KEY:      "${EVOLUTION_API_KEY}"
      OPENROUTER_API_KEY:     "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL:       "${OPENROUTER_MODEL:-openai/gpt-4o-mini}"
      ASAAS_API_KEY:          "${ASAAS_API_KEY}"
      ASAAS_ENV:              "${ASAAS_ENV:-production}"
      ASAAS_WEBHOOK_TOKEN:    "${ASAAS_WEBHOOK_TOKEN}"
      METRICS_TOKEN:          "${METRICS_TOKEN}"
      BETTER_STACK_SOURCE_TOKEN: "${BETTER_STACK_SOURCE_TOKEN:-}"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    restart: unless-stopped
    networks:
      - revendaclick
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  # ── Redis (Evolution cache) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rc_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 10s
    restart: unless-stopped
    networks:
      - revendaclick
    deploy:
      resources:
        limits:
          memory: 160m

  # ── Evolution API (WhatsApp) ─────────────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: rc_evolution
    ports:
      - "127.0.0.1:8081:8080"          # localhost only — Nginx terminates TLS
    environment:
      SERVER_URL:                          "https://evolution.revendaclick.com.br"
      AUTHENTICATION_API_KEY:             "${EVOLUTION_API_KEY}"
      DATABASE_PROVIDER:                  "postgresql"
      # CRITICAL: session pooler port 5432 (NOT transaction pooler 6543)
      DATABASE_CONNECTION_URI:            "${EVOLUTION_DATABASE_URL}"
      DATABASE_CONNECTION_CLIENT_NAME:    "evolution_api"
      DATABASE_SAVE_DATA_INSTANCE:        "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE:     "true"
      DATABASE_SAVE_MESSAGE_UPDATE:       "true"
      DATABASE_SAVE_DATA_CONTACTS:        "true"
      DATABASE_SAVE_DATA_CHATS:           "true"
      DATABASE_SAVE_DATA_LABELS:          "true"
      DATABASE_SAVE_DATA_HISTORIC:        "true"
      WEBHOOK_GLOBAL_ENABLED:             "true"
      WEBHOOK_GLOBAL_URL:                 "http://backend:8080/api/webhooks/evolution"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS:   "false"
      CACHE_REDIS_ENABLED:                "false"
      CACHE_REDIS_URI:                    "redis://rc_redis:6379"
      CACHE_REDIS_PREFIX_KEY:             "evolution"
      CACHE_REDIS_SAVE_INSTANCES:         "false"
      QRCODE_LIMIT:                       "30"
      LOG_LEVEL:                          "ERROR"
      NODE_OPTIONS:                       "--max-old-space-size=400"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s
    restart: unless-stopped
    networks:
      - revendaclick
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  # ── Daily backup (03:00 UTC) ──────────────────────────────────────────────────
  backup:
    image: alpine:3.20
    container_name: rc_backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache postgresql-client bash > /dev/null 2>&1
        while true; do
          NOW=$(date -u +%s)
          H=$(date -u +%H | sed 's/^0//'); M=$(date -u +%M | sed 's/^0//'); S=$(date -u +%S | sed 's/^0//')
          H=${H:-0}; M=${M:-0}; S=${S:-0}
          ELAPSED=$(( H*3600 + M*60 + S ))
          TARGET_SEC=$(( 3*3600 ))
          if [ "$ELAPSED" -lt "$TARGET_SEC" ]; then
            WAIT=$(( TARGET_SEC - ELAPSED ))
          else
            WAIT=$(( 86400 - ELAPSED + TARGET_SEC ))
          fi
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] backup: next run in ${WAIT}s"
          sleep "$WAIT"
          bash /scripts/backup.sh || echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] backup: ERROR — check logs"
        done
    environment:
      DATABASE_URL:            "${DATABASE_URL}"
      BACKUP_S3_BUCKET:        "${BACKUP_S3_BUCKET:-}"
      AWS_ACCESS_KEY_ID:       "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY:   "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION:      "${AWS_DEFAULT_REGION:-sa-east-1}"
    volumes:
      - /opt/revendaclick/backups:/opt/revendaclick/backups
      - /opt/revendaclick/backup.sh:/scripts/backup.sh:ro
    restart: unless-stopped
    networks:
      - revendaclick
    deploy:
      resources:
        limits:
          memory: 128m

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  backend_logs:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  revendaclick:
    name: revendaclick
    driver: bridge
