# =============================================================================
# RevendaClick — Nginx Production Config
# Deploy : /etc/nginx/nginx.conf
# Domains: api.revendaclick.com.br | evolution.revendaclick.com.br
# SSL    : Let's Encrypt via certbot --nginx
# =============================================================================

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ── Core ──────────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 4096;
    server_tokens       off;
    client_max_body_size 64m;
    client_body_timeout  30s;
    client_header_timeout 10s;
    send_timeout         30s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:20m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=evo_limit:10m   rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Proxy Cache (optional — speeds up repeated GET requests) ─────────────
    proxy_cache_path /var/cache/nginx levels=1:2
                     keys_zone=api_cache:10m max_size=100m
                     inactive=60m use_temp_path=off;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream rc_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream rc_evolution {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    # ── Map: real IP from Cloudflare / proxy headers ──────────────────────────
    map $http_x_forwarded_proto $real_scheme {
        default $scheme;
        https   https;
    }

    # =========================================================================
    # api.revendaclick.com.br
    # =========================================================================

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name api.revendaclick.com.br;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/html;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.revendaclick.com.br;

        # SSL — managed by Certbot (do not edit this block manually)
        ssl_certificate     /etc/letsencrypt/live/api.revendaclick.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.revendaclick.com.br/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
        # ssl_session_* already set by options-ssl-nginx.conf — do not duplicate

        # Security headers (strip backend duplicates first)
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Request-ID;

        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY"                                          always;
        add_header X-Content-Type-Options     "nosniff"                                       always;
        add_header X-XSS-Protection           "1; mode=block"                                 always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"      always;
        add_header X-Request-ID               $request_id                                     always;

        # Rate limiting
        limit_req       zone=api_limit burst=60 nodelay;
        limit_conn      conn_limit 100;
        limit_req_status 429;

        access_log /var/log/nginx/api.revendaclick.com.br.access.log main;
        error_log  /var/log/nginx/api.revendaclick.com.br.error.log  warn;

        # Health check — no rate limit, no auth
        location = /health {
            proxy_pass         http://rc_backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # API routes
        location / {
            # Fast CORS preflight response (no backend round-trip needed)
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "$http_origin"                         always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS"    always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
                add_header Access-Control-Allow-Credentials "true"                             always;
                add_header Access-Control-Max-Age       300                                    always;
                return 204;
            }

            proxy_pass          http://rc_backend;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $real_scheme;
            proxy_set_header    X-Request-ID       $request_id;

            proxy_read_timeout    30s;
            proxy_connect_timeout  5s;
            proxy_send_timeout    30s;

            proxy_buffering    on;
            proxy_buffer_size  16k;
            proxy_buffers      8 16k;
            proxy_busy_buffers_size 32k;

            # Pass errors from backend upstream
            proxy_intercept_errors off;
        }
    }

    # =========================================================================
    # evolution.revendaclick.com.br
    # =========================================================================

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name evolution.revendaclick.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name evolution.revendaclick.com.br;

        ssl_certificate     /etc/letsencrypt/live/api.revendaclick.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.revendaclick.com.br/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
        # ssl_session_* already set by options-ssl-nginx.conf — do not duplicate

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                           always;
        add_header X-Content-Type-Options    "nosniff"                              always;

        client_max_body_size 50m;

        limit_req       zone=evo_limit burst=120 nodelay;
        limit_conn      conn_limit 200;
        limit_req_status 429;

        access_log /var/log/nginx/evolution.revendaclick.com.br.access.log main;
        error_log  /var/log/nginx/evolution.revendaclick.com.br.error.log  warn;

        # WebSocket + HTTP — Evolution API uses Socket.IO
        location / {
            proxy_pass         http://rc_evolution;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $real_scheme;

            # Long timeout for persistent WhatsApp connections
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
            proxy_connect_timeout    10s;

            proxy_buffering off;    # disable buffering for WebSocket
        }
    }
}
